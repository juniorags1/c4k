name: Validate Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore C4K.slnx --locked-mode
      - name: Build
        run: dotnet build C4K.slnx -c Release --no-restore
      - name: Run library and automation checks
        run: dotnet run --project tests/C4K.LibraryTests -c Release --no-build
      - name: Run HTTP checks
        run: ./scripts/Smoke-Test.ps1
      - name: Publish Windows application
        run: dotnet publish src/C4K.App -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Validate published application
        run: ./scripts/Smoke-Test.ps1 -Published
